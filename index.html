<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System Manager</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; margin: 0; }
        .box { border: 1px solid #0f0; padding: 15px; margin-bottom: 20px; background: #050505; }
        input, select, button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 8px; margin: 5px 0; font-family: monospace; }
        button { cursor: pointer; font-weight: bold; }
        button:hover { background: #0f0; color: #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #0f0; padding: 6px; text-align: left; font-size: 12px; word-break: break-all; }
        .key-text { color: #ffff00; font-weight: bold; }
        
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .login-box { border: 2px solid #0f0; padding: 30px; text-align: center; background: #111; box-shadow: 0 0 15px #0f0; }
    </style>
</head>
<body>

    <!-- หน้าต่างใส่รหัสผ่านเข้าเว็บ -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔒 กรุณากรอกรหัสผ่านเพื่อเข้าสู่ระบบ</h2>
            <input type="password" id="sitePassword" placeholder="กรอกรหัสผ่าน..." style="width: 250px; text-align: center;"><br>
            <button onclick="checkPassword()">เข้าสู่ระบบ</button>
            <div id="loginError" style="color: #f00; margin-top: 10px;"></div>
        </div>
    </div>

    <!-- ส่วนเนื้อหาหลัก -->
    <div id="mainContent" style="display: none;">
        <h1>🔑 Key Manager & Verifier System</h1>

        <div class="box">
            <h2>[1] ตรวจสอบคีย์ (User Portal)</h2>
            <input type="text" id="userKey" placeholder="วางคีย์ 67 ตัวอักษรที่นี่..." style="width: 70%;">
            <button onclick="verifyKey()">ตรวจสอบ / เปิดใช้งาน</button>
            <div id="userResult" style="margin-top: 10px;"></div>
        </div>

        <div class="box">
            <h2>[2] แผงสร้างคีย์ (Admin Panel)</h2>
            <label>เลือกประเภทคีย์: </label>
            <select id="keyDays">
                <option value="1">1 วัน</option>
                <option value="2">2 วัน</option>
                <option value="3">3 วัน</option>
                <option value="4">4 วัน</option>
                <option value="5">5 วัน</option>
                <option value="6">6 วัน</option>
                <option value="7">7 วัน</option>
                <option value="8">8 วัน</option>
                <option value="9">9 วัน</option>
                <option value="10">10 วัน</option>
                <option value="20">20 วัน</option>
                <option value="30">30 วัน</option>
                <option value="lifetime">ถาวร (Lifetime)</option>
            </select>
            <button onclick="createKey()">+ สุ่มสร้างคีย์ 67 ตัวอักษร</button>
            <div id="adminResult" style="margin-top: 10px;"></div>
        </div>

        <div class="box">
            <h2>[3] รายการคีย์ในระบบทั้งหมด <button onclick="loadKeys()">🔄 รีเฟรชตาราง</button></h2>
            <table>
                <thead>
                    <tr>
                        <th>คีย์ (67 ตัวอักษร)</th>
                        <th>ประเภท</th>
                        <th>IP ที่ล็อค</th>
                        <th>วันหมดอายุ</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="keysTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = "แอดหล่อจนขี้ตีนหาย";

        function checkPassword() {
            const inputPass = document.getElementById('sitePassword').value;
            const errDiv = document.getElementById('loginError');

            if (inputPass === CORRECT_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadKeys();
            } else {
                errDiv.innerText = '❌ รหัสผ่านไม่ถูกต้อง!';
            }
        }

        document.getElementById('sitePassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        async function verifyKey() {
            const key = document.getElementById('userKey').value.trim();
            const resDiv = document.getElementById('userResult');
            resDiv.innerText = 'กำลังตรวจสอบ...';

            try {
                const res = await fetch('/api/verify-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    resDiv.innerHTML = `
                        <p style="color: #0f0;">✅ ${data.message}</p>
                        <p>ประเภท: ${data.typeDays}</p>
                        <p>IP ล็อค: ${data.lockedIp}</p>
                        <p>วันหมดอายุ: ${data.expiresAt}</p>
                        <p>เวลาที่เหลือ: <b>${data.remainingText}</b></p>
                    `;
                } else {
                    resDiv.innerHTML = `<p style="color: #f00;">❌ ${data.message}</p>`;
                }
                loadKeys();
            } catch (err) {
                resDiv.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
            }
        }

        async function createKey() {
            const days = document.getElementById('keyDays').value;
            try {
                const res = await fetch('/api/admin/create-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ days })
                });
                const data = await res.json();

                document.getElementById('adminResult').innerHTML = `
                    <p>สร้างคีย์สำเร็จ (${data.typeDays === 'lifetime' ? 'ถาวร' : data.typeDays + ' วัน'}):</p>
                    <p class="key-text">${data.key}</p>
                `;
                loadKeys();
            } catch (err) {
                alert('ไม่สามารถสร้างคีย์ได้');
            }
        }

        async function loadKeys() {
            try {
                const res = await fetch('/api/admin/keys');
                const keys = await res.json();
                const tbody = document.getElementById('keysTable');
                tbody.innerHTML = '';

                keys.forEach(k => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="key-text">${k.keyCode}</td>
                            <td>${k.typeDays === 'lifetime' ? 'ถาวร' : k.typeDays + ' วัน'}</td>
                            <td>${k.lockedIp || 'ยังไม่เปิดใช้งาน'}</td>
                            <td>${k.expiresAt || 'ยังไม่เปิดใช้งาน'}</td>
                            <td>${k.isActive ? 'ปกติ' : 'ระงับ'}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Failed to load keys', err);
            }
        }
    </script>
</body>
</html>
